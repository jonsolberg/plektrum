<!DOCTYPE html>
<!-- Plektrum – a toolbox for guitarists. Copyright (C) 2026 Jon Solberg. GNU GPL v3 or later. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Plektrum</title>
<style>
:root{
  --bg:#f3efe7;--card:#fffcf6;--card2:#ebe5d9;--ink:#1e2422;--muted:#6c716c;--line:#ddd5c6;
  --accent:#0d6b61;--accent-soft:#d5ebe6;--on-accent:#fff;--root:#c4552a;--good:#2f8f4e;--warn:#c4552a;
  --str:#7e776b;--fret:#b9b0a0;--wood:#efe7d8;--dim:#7b5ea7;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 6px 18px rgba(40,30,10,.06);
}
:root.dark{
  --bg:#111514;--card:#1a201e;--card2:#242c29;--ink:#e8ebe6;--muted:#8f9792;--line:#2d3532;
  --accent:#3cb5a2;--accent-soft:#163a35;--on-accent:#04201b;--root:#ee8a5c;--good:#55c27a;--warn:#ee8a5c;
  --str:#7a827e;--fret:#3d4743;--wood:#1f2624;--dim:#a98bd6;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;touch-action:pan-x pan-y;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
*{scrollbar-width:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none;width:0;height:0}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:7;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 12px 6px 16px}
header h1{font-size:21px;margin:0;flex:none;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header h1 svg{width:22px;height:22px;color:var(--accent)}
.hsearch{flex:1;min-width:0;position:relative;margin-left:8px}
#hsearch{width:100%;padding:8px 10px 8px 34px;border-radius:999px;font-size:15px;background:var(--card);border:1px solid var(--line)}
.hsearch span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.hsearch span svg{width:17px;height:17px}
header .sugg{left:12px;right:12px;top:calc(100% - 2px)}
.iconbtn{border:0;background:transparent;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--card2)}
.iconbtn svg{width:22px;height:22px}
body.kb nav,body.kb .toast{display:none}
body.kb{padding-bottom:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:7px 0 9px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:23px;height:23px;padding:2px 10px;box-sizing:content-box;border-radius:14px}
nav button.on{color:var(--accent);font-weight:650}
nav button.on svg{background:var(--accent-soft)}
main{padding:0 12px;max-width:760px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:14px 0 7px;font-weight:600}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
.chip.ghost{border-style:dashed;color:var(--muted)}
.grid12{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid12 .chip{padding:8px 0;text-align:center}
.btn{border:0;background:var(--card2);border-radius:13px;padding:10px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:44px}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:650}
.btn.small{min-height:34px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn svg{width:19px;height:19px;flex:none}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=search],input[type=text],select{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* chord view */
.chordhead{display:flex;align-items:flex-end;gap:10px}
.chordname{font-size:34px;font-weight:750;line-height:1.05;letter-spacing:-.5px}
.chordlong{color:var(--muted);font-size:14px;margin-top:2px}
.star{margin-left:0}
.instrow{display:flex;gap:8px;margin:8px 0 0}
.instrow select{flex:1;min-width:0;padding:7px 28px 7px 10px;font-size:14px;border-radius:12px}
.instsel{width:auto;max-width:42%;padding:6px 26px 6px 10px;font-size:13.5px;border-radius:999px;margin-left:auto;flex:none}
.fav small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star.on svg{fill:var(--root);color:var(--root)}
.diagwrap{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 2px}
.diagwrap .big{width:min(62vw,250px)}
.chordbar{display:flex;gap:8px;align-items:center;max-width:380px;margin:0 auto}
.chordbar .seg{flex:1}
.btn.sq{width:44px;min-width:44px;padding:0}
.voicenav{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.notes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 12px}
.note{border:0;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;background:var(--card2);border-radius:10px;padding:4px 9px;min-width:40px}
.note b{font-size:15px}.note span{font-size:11px;color:var(--muted)}
.note.r{background:var(--root);color:#fff}.note.r span{color:#fff;opacity:.85}
.thumbs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 0 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;border:1.5px solid transparent;background:var(--card2);border-radius:12px;padding:4px 4px 2px;cursor:pointer}
.thumb.on{border-color:var(--accent)}
.thumb svg{width:64px;display:block}
.search{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;display:none}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font-size:16px;cursor:pointer}
.sugg button:active,.sugg button.hi{background:var(--card2)}
.favs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:2px}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;width:84px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 4px 4px;text-align:center;cursor:pointer}
.fav svg{width:64px;display:block;margin:0 auto}
.fav b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* blinking notes */
.hl{fill:none;stroke:var(--ink);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.hl.on{animation:hlb .55s ease-out}
@keyframes hlb{0%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1)}}
#boardSvg g{transform-box:fill-box;transform-origin:center}
#boardSvg g.on{animation:nb .5s ease-out}
@keyframes nb{0%{transform:scale(1.45);filter:brightness(1.35) drop-shadow(0 0 6px var(--accent))}100%{transform:none;filter:none}}

/* studio */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 4px 4px;text-align:center;cursor:pointer;min-height:96px}
.slot b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot small{display:block;color:var(--muted);font-size:11px;min-height:14px}
.slot svg{width:56px;display:block;margin:0 auto}
.slot.play{border-color:var(--accent);background:var(--accent-soft)}
.slot.add{border-style:dashed;color:var(--muted);display:grid;place-items:center;font-size:28px}
.sgrid{display:grid;gap:3px;cursor:pointer}
.sg{background:var(--card2);border-radius:7px;text-align:center;padding:5px 0 3px;min-width:0;transition:background .05s}
.sg b{display:block;font-size:17px;line-height:22px;height:22px;white-space:nowrap;overflow:hidden}
.sg i{display:block;font-size:10px;color:var(--muted);font-style:normal}
.sg.bt{box-shadow:inset 2px 0 0 var(--line)}
.sg.soft b{opacity:.45;font-size:15px}
.sg.stab b::after{content:"·";font-size:13px}
.sg.on{background:var(--accent);color:var(--on-accent)}
.sg.on i{color:var(--on-accent)}
.sleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px;color:var(--muted)}
.sleg b{color:var(--ink)}
.countin{text-align:center;font-size:44px;font-weight:750;color:var(--accent);height:0;overflow:visible;position:relative;top:-120px;pointer-events:none}
.guide summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:650;font-size:15.5px;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary svg{width:22px;height:22px;color:var(--accent);flex:none}
.guide summary span{flex:1}
.guide summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s}
.guide[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.guide h3{font-size:14.5px;margin:16px 0 4px}
.guide p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.guide p b{color:var(--ink);font-weight:650}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:13px;padding:8px 8px 8px 12px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14.5px}
.item .t span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on{outline:2px solid var(--accent)}

/* circle */
.circle{display:block;width:100%;max-width:420px;margin:0 auto;touch-action:manipulation}
.circle text{font-family:inherit;pointer-events:none}
.circle .seg-el{cursor:pointer;transition:fill .15s}
.dchords{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchord{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0 5px;text-align:center;cursor:pointer}
.dchord i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.dchord b{font-size:14px;white-space:nowrap}
.dchord.lit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dchord.lit i{color:var(--on-accent);opacity:.8}

/* scales */
.board{overflow-x:auto;overflow-y:hidden;margin:0 -14px;padding:0 14px}
.board svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-2px;margin-right:5px}

/* tuner */
.tnote{text-align:center;margin-top:-6px}
.tnote b{font-size:64px;font-weight:750;line-height:1}
.tnote sub{font-size:22px;color:var(--muted);font-weight:600;vertical-align:baseline}
.tread{display:flex;justify-content:center;gap:18px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;margin:4px 0 6px}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strbtn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0 6px;cursor:pointer;text-align:center}
.strbtn b{display:block;font-size:17px}
.strbtn small{font-size:11px;color:var(--muted)}
.strbtn.near{border-color:var(--accent)}
.strbtn.lock{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.strbtn.lock small{color:var(--on-accent)}
.strbtn.ok b::after{content:" ✓";color:var(--good)}
.strbtn.lock.ok b::after{color:var(--on-accent)}
.strobe{width:min(68vw,260px);height:min(68vw,260px);display:block;margin:4px auto 6px}
.strobe.bands{width:100%;height:160px;margin:4px 0 8px}
.tstatus{text-align:center;font-weight:650;font-size:16px;color:var(--muted);min-height:22px;margin-top:2px}
.tstatus.close{color:var(--accent)}
.tstatus.good{color:var(--good)}
.strbtn .oct{font-size:11px;color:var(--muted);font-weight:500;margin-left:1px}
.strbtn.lock .oct{color:var(--on-accent)}
.history{width:100%;height:70px;display:block;background:var(--card2);border-radius:12px}
.level{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:8px}
.level i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--card2);font-size:18px;cursor:pointer}
.stepper span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.custom{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 6px;margin-top:8px}
.custom div{display:flex;flex-direction:column;align-items:center;gap:3px}
.custom button{width:100%;border:0;background:var(--card2);border-radius:9px;height:30px;cursor:pointer}
.custom b{font-size:15px}

/* tuner */
.tunerhero{transition:background .25s,border-color .25s;padding-top:10px}
.tunerhero[data-st=good]{background:color-mix(in srgb,var(--good) 12%,var(--card));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.tview{max-width:340px;margin:0 auto 8px}
.tview .seg{padding:2px}.tview .seg button{padding:5px 4px;font-size:13px}
.gauge{display:block;width:100%;max-width:400px;margin:0 auto -4px}
.gauge .tk{stroke:var(--muted);stroke-linecap:round;opacity:.75}
.gauge .tks{font-size:20px;opacity:.6}
.gauge .tzone{fill:var(--good);opacity:.10;transition:opacity .2s}
.tunerhero[data-st=good] .gauge .tzone{opacity:.32}
.gauge #needle{filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.gauge .tk0{stroke:var(--good);stroke-linecap:round;stroke-width:3}
.gauge .tkl{font-size:11px;fill:var(--muted)}
.gauge .ndl{fill:var(--ink);transition:fill .2s}
.gauge .hub{fill:var(--ink);transition:fill .2s}.gauge .hub2{fill:var(--card)}
.tunerhero[data-st=good] .gauge .ndl,.tunerhero[data-st=good] .gauge .hub{fill:var(--good)}
.tunerhero[data-st=good] .gauge #needle{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--good) 80%,transparent))}
.tnoterow{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:2px}
.tside{font-size:34px;font-weight:700;color:var(--line);width:34px;text-align:center;transition:color .15s,transform .15s}
.tside.lit{color:var(--warn);transform:scale(1.15)}
.tunerhero[data-st=close] .tside.lit{color:var(--accent)}
.tunerhero .tnote{margin:0;min-width:110px}
.tunerhero .tnote b{font-size:76px;letter-spacing:-1px;transition:color .2s}
.tunerhero[data-st=good] .tnote b{color:var(--good)}
.tcents{text-align:center;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:-4px;min-height:26px}
.tunerhero .tstatus{font-size:15px;margin-top:2px}
.tchips{display:flex;justify-content:center;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.tchips span{background:var(--card2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tunerhero .history{height:64px}
.tunerhero .level{height:4px;margin-top:6px}
.tgo{width:100%;margin-top:12px}
.strobe{background:transparent}
.headstock{display:block;width:100%;max-width:340px;margin:10px auto 4px}
.hs-neck{fill:var(--wood);opacity:.7}
.hs-body{fill:var(--wood);stroke:var(--line);stroke-width:2}
.hs-nut{fill:var(--ink);opacity:.75}
.hs-string{stroke:var(--str)}
.hs-shaft{stroke:var(--fret);stroke-width:5;stroke-linecap:round}
.hs-post{fill:var(--card);stroke:var(--fret);stroke-width:2}
.peg{cursor:pointer}
.peg-c{fill:var(--card);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s}
.peg-n{font-size:19px;font-weight:750;fill:var(--ink)}
.peg-o{font-size:10px;font-weight:500;fill:var(--muted)}
.peg-h{font-size:9.5px;fill:var(--muted)}
.peg.near .peg-c{stroke:var(--accent);stroke-width:3.5}
.peg.lock .peg-c{fill:var(--accent);stroke:var(--accent)}
.peg.lock .peg-n,.peg.lock .peg-o,.peg.lock .peg-h{fill:var(--on-accent)}
.peg-ok{display:none}
.peg-ok circle{fill:var(--good)}
.peg-ok path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.peg.ok .peg-ok{display:inline}
.peg.ok:not(.lock):not(.near) .peg-c{stroke:var(--good)}

/* practice */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.lesson-item i{font-style:normal;width:28px;height:28px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.lesson-item b{flex:1;font-size:15px}
.lesson-item svg{width:18px;height:18px;color:var(--muted)}
.lesson h3{font-size:16px;margin:18px 0 6px}
.lesson .lp{font-size:15px;line-height:1.6;margin:10px 0}
.lex{background:var(--card2);border-radius:14px;padding:10px 12px;margin:10px 0}
.lex .row{flex-wrap:nowrap}
.lex .ttl{font-weight:650;font-size:14px;flex:1}
.lex .notes{justify-content:flex-start;margin:8px 0 0}
.lrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow b{flex:1;font-size:14.5px}
.lrow span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .pl{width:30px;height:30px;border-radius:15px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.lrow .pl svg{width:14px;height:14px}
.lrow small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.ltab{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border-radius:10px;padding:10px;overflow-x:auto;overflow-y:hidden;margin:0 0 8px}
.lgoal{font-size:15px;color:var(--muted);margin:6px 0 4px;font-style:italic}
.lesson .lp b{color:var(--ink)}
.ltry{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:4px 14px 14px 4px;padding:10px 14px;margin:12px 0;font-size:14.5px;line-height:1.55}
.lkey{border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin:16px 0 4px;font-size:14.5px;line-height:1.5}
.ltry .lbl,.lkey .lbl{margin:0 0 4px}
.lkey ul{margin:0;padding-left:18px}.lkey li{margin:3px 0}
.lchips{justify-content:flex-start;margin-top:6px}.lchips .note{min-width:34px;padding:3px 6px}
.lesson .note,.lesson .ln,.lesson .tn{transition:background .25s,color .25s}
.lesson .note.lon{animation:lon .42s ease-out}
@keyframes lon{0%{background:var(--accent);color:var(--on-accent);transform:scale(1.18)}100%{transform:none}}
.lesson .note.lon b,.lesson .note.lon span{animation:lonc .42s ease-out}
@keyframes lonc{0%,40%{color:var(--on-accent)}}
.lesson .note.r.lon{animation-name:lonr}
@keyframes lonr{0%{filter:brightness(1.3);transform:scale(1.18)}100%{transform:none}}
.lesson .ln{font-style:normal;border-radius:5px;padding:0 2px}
.lesson .ln.lon,.lesson .tn.lon{animation:lonx .45s ease-out}
@keyframes lonx{0%{background:var(--accent);color:var(--on-accent)}100%{background:transparent}}
.lesson .tn{border-radius:3px}
.lrow.lplaying{background:var(--accent-soft);border-radius:10px}
.dchord.lplaying{outline:2px solid var(--accent);outline-offset:1px}
.lesson .lns{letter-spacing:.2px}
.lesson .diagwrap .hl.lon{animation:hlb .55s ease-out}
.lvis{display:flex;justify-content:center;padding:8px 0 4px}
.lvis .qkeys{max-width:460px}
.lvis .qboard{width:100%;height:auto}
.qkeys .km,.qboard .fd{transform-box:fill-box;transform-origin:center}
.qkeys .km.lon,.qboard .fd.lon{animation:kml .45s ease-out}
@keyframes kml{0%{transform:scale(1.45);filter:brightness(1.3) drop-shadow(0 0 4px var(--accent))}100%{transform:none;filter:none}}
.lex .notes{gap:3px;flex-wrap:wrap}
.lex .notes .note{min-width:28px;flex:1 0 auto;max-width:64px;padding:4px 3px}
.lrow b{min-width:0}
.lrow small.lprog{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lbr{flex-basis:100%;height:0}
.lstrum .lch{min-width:24px;font-size:15px}
.lstrum .lch.rest{color:var(--muted)}
.lrow small.lcount{font-size:11px;letter-spacing:.3px;margin-top:2px}
.lch{font-style:normal;font-weight:650;color:var(--ink);background:var(--card);border-radius:7px;padding:2px 7px;font-size:13px;min-width:22px;text-align:center}
.lch.lon{animation:lchl .9s ease-out}
@keyframes lchl{0%,55%{background:var(--accent);color:var(--on-accent)}100%{background:var(--card)}}
.lgo{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lnav{display:flex;gap:8px;margin-top:12px}
.lnav .btn{flex:1;font-size:14px}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);min-height:130px}
.ptile svg{width:28px;height:28px;color:var(--accent);margin-bottom:4px}
.ptile b{font-size:15.5px}
.ptile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.ptile em{font-style:normal;font-size:12px;color:var(--accent);font-weight:650;margin-top:auto;padding-top:4px}
.pback{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pback b{font-size:17px}
.qintro{display:flex;justify-content:center;margin:6px 0 10px}.qintro svg{width:44px;height:44px;color:var(--accent)}
.qtext{text-align:center;color:var(--muted);margin:6px 0 10px}
.qtext.big{font-size:18px;color:var(--ink);line-height:1.4;margin:16px 0}
.qtext b{color:var(--ink)}
.qsteps{font-size:22px;font-weight:750;letter-spacing:.06em;margin-top:8px;color:var(--accent)}
.qear{display:flex;justify-content:center;margin:4px 0}.qear svg{width:54px;height:54px;color:var(--accent)}
.qboard{display:block;width:100%;margin:4px 0}
.qhead{font-size:40px;font-weight:750;text-align:center}
.qfeed{text-align:center;margin-top:10px;font-weight:650}.qfeed.good{color:var(--good)}.qfeed.bad{color:var(--warn)}
.qvisual{display:flex;justify-content:center;margin:2px 0 8px}
.qkeys{width:100%;max-width:420px;height:auto;display:block}
.qvisual .diagwrap svg{max-height:210px}
.qexplain{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14.5px;line-height:1.55}
.qexplain .exchips{justify-content:flex-start;margin:8px 0 6px}
.qexplain .exchips + *{margin-top:4px}
.qexplain .exchips .note{min-width:36px;padding:3px 7px}
.quizopts.small .btn{font-size:15px;font-weight:600}
.quizopts.g12{grid-template-columns:repeat(4,1fr)}
.quizopts.g12 .btn{min-height:44px;font-size:16px}
.bpm{font-size:64px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bpm small{font-size:16px;color:var(--muted);font-weight:500}
.msteps{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;gap:3px;margin:16px 0 12px}
.msep{flex:0 0 6px}
.mstep{flex:1 1 0;min-width:6px;max-width:26px;height:46px;border:0;border-radius:7px;background:var(--card2);padding:0;display:flex;align-items:flex-end;cursor:pointer}
.mstep i{display:block;width:100%;border-radius:6px;background:var(--accent);transition:transform .05s}
.mstep.l3 i{height:100%;background:var(--root)}
.mstep.l2 i{height:66%}
.mstep.l1 i{height:34%;opacity:.55}
.mstep.l0 i{height:0}
.mstep.on{outline:3px solid var(--ink);outline-offset:1px}
.btn.flash{animation:tapflash .35s ease-out}
@keyframes tapflash{0%,35%{background:var(--accent);color:var(--on-accent);transform:scale(.96)}100%{background:var(--card2);color:var(--ink);transform:none}}
.row.tempo{flex-wrap:nowrap;gap:6px}
.row.tempo .btn{min-width:0;padding:0 9px;flex:none}
.row.tempo input{min-width:60px}
.bpm .unit{font-size:28px;color:var(--muted);font-weight:600}
.beats{display:flex;justify-content:center;gap:12px;margin:16px 0}
.beat{width:22px;height:22px;border-radius:11px;background:var(--card2);transition:background .05s,transform .05s}
.beat.first{width:26px;height:26px;border-radius:13px}
.beat.on{background:var(--accent);transform:scale(1.15)}
.beat.first.on{background:var(--root)}
.quizopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quizopts .btn{font-size:18px;font-weight:650;min-height:52px}
.quizopts .btn.right{background:var(--good);color:#fff}
.quizopts .btn.wrong{background:var(--warn);color:#fff}
.progress{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:10px}
.progress i{display:block;height:100%;background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;margin:0 0 10px}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setgroup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:12px}
.setgroup .setrow:last-child{border-bottom:0}
.setstack{padding:10px 0;border-bottom:1px solid var(--line)}
.setstack:last-child{border-bottom:0}
.setstack .t{margin-bottom:8px}
.sethead{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin:14px 4px 6px}
.setrow:last-child{border-bottom:0}
.setrow>div:first-child{flex:1}
.setrow small{display:block;color:var(--muted);font-size:12.5px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--card2);border-radius:14px;transition:.15s;border:1px solid var(--line)}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span::after{left:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
a{color:var(--accent)}
</style>
</head>
