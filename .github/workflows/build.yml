name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Signed with the release key when the repository secrets are set, otherwise a debug build.
      # Secrets: PLEKTRUM_KEYSTORE_BASE64 (the .jks file, base64), PLEKTRUM_KEYSTORE_PASSWORD,
      #          PLEKTRUM_KEY_ALIAS, PLEKTRUM_KEY_PASSWORD
      - name: Build APK
        env:
          KS_B64: ${{ secrets.PLEKTRUM_KEYSTORE_BASE64 }}
          PLEKTRUM_KEYSTORE_PASSWORD: ${{ secrets.PLEKTRUM_KEYSTORE_PASSWORD }}
          PLEKTRUM_KEY_ALIAS: ${{ secrets.PLEKTRUM_KEY_ALIAS }}
          PLEKTRUM_KEY_PASSWORD: ${{ secrets.PLEKTRUM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p out
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export PLEKTRUM_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/Plektrum.apk
            echo "Signed with the release key"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/Plektrum.apk
            echo "::warning::No signing secrets – this is a debug build"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: plektrum-apk
          path: out/Plektrum.apk

      - name: Publish APK to the "apk" branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp out/Plektrum.apk /tmp/out/Plektrum.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Plektrum.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle* | head -1)
          TAG="v$VERSION"
          # Fixed name, so releases/latest/download/Plektrum.apk always points at the newest build.
          cp out/Plektrum.apk Plektrum.apk
          cp out/Plektrum.apk "Plektrum-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Plektrum-$VERSION.apk" Plektrum.apk --clobber
          else
            gh release create "$TAG" "Plektrum-$VERSION.apk" Plektrum.apk --target "$GITHUB_SHA" \
              --title "Plektrum $VERSION" --notes "Built from ${GITHUB_SHA::7}." --latest
          fi
